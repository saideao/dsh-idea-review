name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Host half (skill/tool/routes, real python subprocess)
        run: node test/host.test.mjs

      - name: Skill half (scripts, zh/en pipelines, offline)
        run: python3 test/smoke.py
